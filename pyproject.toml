[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-stack"
version = "0.1.0"
description = "Modular autonomous-navigation perception research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "ultralytics>=8.3.0,<8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
perception-demo = "perception_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
