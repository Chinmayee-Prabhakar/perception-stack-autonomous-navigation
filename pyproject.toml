[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perception-stack"
version = "0.1.0"
description = "Modular autonomous-navigation perception research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "opencv-python>=4.8,<6",
  "torch>=2.0",
  "torchvision>=0.15",
  "ultralytics>=8.3.0,<8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
perception-demo = "perception_stack.cli:main"
perception-depth-demo = "perception_stack.depth_cli:main"
perception-road-demo = "perception_stack.road_cli:main"
perception-fusion-demo = "perception_stack.fusion_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"perception_stack._vendor.depth_anything_v2_metric" = ["LICENSE"]
"perception_stack._vendor.twinlite_net_plus" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
